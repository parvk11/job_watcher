name: intern-watch

on:
  schedule:
    - cron: "24 */2 * * *"   # every 2 hours, :24 past
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # push state.json back
  issues: write                # open an alert issue

concurrency:
  group: intern-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll job boards
        run: python3 check_jobs.py

      - name: Push notification (ntfy / Pushover, if configured)
        if: ${{ env.NTFY_TOPIC != '' || env.PUSHOVER_TOKEN != '' }}
        run: python3 notify.py

      - name: Open GitHub issue for new roles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s new_jobs.md ]; then
            n=$(python3 -c "import json;print(len(json.load(open('new_jobs.json'))))")
            gh issue create \
              --title "🎯 $n new MLE/RE internship(s) — $(date -u +%Y-%m-%d)" \
              --body-file new_jobs.md \
              --assignee parvk11 || true
          fi

      - name: Persist state.json
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "intern-watch[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ) [skip ci]"
            git push
          fi
